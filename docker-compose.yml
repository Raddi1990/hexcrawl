# Standalone dev/test compose for THIS repo in isolation. Production runs the
# prebuilt CI image (ghcr.io/raddi1990/hexcrawl) from the server repo's own compose
# setup -- network name, volume convention, reverse proxy -- which is out of scope
# here and needs to be resolved against that project directly.
services:
  hexcrawl:
    build: .
    ports:
      - "8000:8000"
    environment:
      HEXCRAWL_DATA_DIR: /data
      HEXCRAWL_ADMIN_USERNAME: admin
      HEXCRAWL_ADMIN_PASSWORD: change-me-on-first-run
      HEXCRAWL_COOKIE_SECRET: dev-only-change-me
      HEXCRAWL_COOKIE_SECURE: "false" # set "true" once served over HTTPS
    volumes:
      # Bind mount (not a named volume): keeps hexcrawl.db directly inspectable/
      # backup-able on the host without docker cp. Gitignored, survives rebuilds.
      - ./data:/data
    restart: unless-stopped
