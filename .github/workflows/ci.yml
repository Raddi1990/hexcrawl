# Tests bei jedem Push/PR. Auf main wird danach das Docker-Image gebaut und als
# ghcr.io/raddi1990/hexcrawl:<commit-sha> veröffentlicht -- deploy.yml rollt dann
# genau dieses Image auf den Server aus, es wird dort nichts mehr gebaut.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # tsc -b && vite build -- echter Typecheck.
      - run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Bei PRs nur bauen (prüft das Dockerfile), auf main zusätzlich pushen.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/raddi1990/hexcrawl:${{ github.sha }}
            ghcr.io/raddi1990/hexcrawl:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
