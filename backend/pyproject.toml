[project]
name = "hexcrawl-backend"
version = "0.1.0"
description = "Hexcrawl-Kartentool backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",  # passlib 1.7.4's self-test crashes on bcrypt>=4.1 (removed __about__, stricter 72-byte check)
    "itsdangerous>=2.2",
    "pillow>=11.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "websockets>=13.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
